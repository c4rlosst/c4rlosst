name: Update contribution graph

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build graph
        env:
          # Personal access token (classic, scope: read:user) so private
          # contributions are included in the counts.
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/build_contributions.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-*.svg
          git diff --cached --quiet || git commit -m "Update contribution graph"
          git push
